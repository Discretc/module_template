name: Windows application
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Test, build, smoke test compiled executable, and archive
        shell: pwsh
        run: ./build_windows.ps1
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v6
        with:
          name: ModuleOutlineGenerator-Windows
          path: release/ModuleOutlineGenerator-Windows.zip
          if-no-files-found: error
